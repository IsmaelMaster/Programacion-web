<!DOCTYPE html>

<!-- Fig. 2.15: formulario2.html -->
<!-- Formulario que usa una variedad de componentes. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Mas formularios
        </title>
    </head>

    <body>
        <h1>
            Formulario de retroalimentacion.
        </h1>

        <p>
            Llene este formulario para ayudarnos a mejorar nuestro sitio web. 
            Sus comentarios son muy importantes para nosotros.
        </p>

        <!-- Esta etiqueta empieza el formulario, indica el 
        método de enviar la informacion y la ubicacion de la 
        secuencia de comandos de procesamiento del formulario. -->
        <form method = "post" action = "https://www.deitel.com">
            <!-- Las entradas ocultas contienen informacion
            no visible que tambien se enviara-->
            <input type = "hidden" name = "destinatario" value = "deitel@deitel.com">
            <input type = "hidden" name = "asunto" value = "Formulario de retroalimentacion">
            <input type = "hidden" name = "redirigir" value = "Ejemplo1.html">

            <!-- <input type = "text"> Insertar un campo de texto -->
             <p>
                <label>
                    Nombre:
                    <input name = "nombre" type = "text" size = "25">
                </label>
             </p>

             <!-- <textarea> Crea un cuadro de texto multilinea -->
             <p>
                <label>
                    Comentarios: <br>
                    <textarea name = "comentarios" rows = "4" cols = "36">
                        Escriba aqui los comentarios. 
                    </textarea>
                </label>
             </p>

             <!-- <input type = "password" inserta un cuadro de texto 
             que aparece enmarcado con caracteres de asterisco -->
             <p>
                <label>
                    Direccion de correo electronico:
                    <input name = "email" type = "password" size = "25">
                </label>
             </p>

             <p>
                <strong>
                    Cosas que le gustaron:
                </strong> <br>

                <label>
                    Diseño del sitio web:
                    <input name = "cosasgustaron" type = "checkbox" value = "Diseño">
                </label>

                <label>
                    Vinculos:
                    <input name = "cosasgustaron" type = "checkbox" value = "Vinculos">
                </label>

                <label>
                    Facilidad de uso:
                    <input name = "cosasgustaron" type = "checkbox" value = "Facilidad">
                </label>

                <label>
                    Imagenes:
                    <input name = "cosasgustaron" type = "checkbox" value = "Imagenes">
                </label>

                <label>
                    Codigo fuente:
                    <input name = "cosasgustaron" type = "checkbox" value = "Codigo">
                </label>
             </p>

             <!-- <input type = "radio"> Crea un boton de opcion. 
             La diferencia entre botones de opciones y casillas de 
             verificacion es que solo puedes seleccionarse un boton de 
             opciones en un grupo. -->

             <p>
                <strong>
                    Como llego a un sitio web:
                </strong> <br>

                <label>
                    Motor de busqueda
                    <input name = "comositio" type = "radio" value = "Motor de busqueda"> <checked>
                </label>

                <label>
                    Vinculos desde otro sitio web
                    <input name = "comositio" type = "radio" value = "vinculo">
                </label>

                <label>
                    Sitio web Deitel.com
                    <input name = "comositio" type = "radio" value = "deitel.com">
                </label>

                <label>
                    Referencia en un libro
                    <input name = "comositio" type = "radio" value = "libro"> <checked>
                </label>

                <label>
                    Otro
                    <input name = "comositio" type = "radio" value = "otro">
                </label>  
             </p>

             <p>
                <label>
                    Califique nuestro sitio web:
                    <!-- La etiqueta <select> presenta una lista 
                    desplegable con opciones indicandas por las 
                    etiquetas <option> -->
                    <select name = "calificacion">
                        <option selected>
                            Sorprendente
                        </option>

                        <option>
                            10
                        </option>

                        <option>
                            9
                        </option>

                        <option>
                            8
                        </option>

                        <option>
                            7
                        </option>

                        <option>
                            6
                        </option>

                        <option>
                            5
                        </option>

                        <option>
                            4
                        </option>

                        <option>
                            3
                        </option>

                        <option>
                            2
                        </option>

                        <option>
                            1
                        </option>

                        <option>
                            Malo
                        </option>
                    </select>
                </label>
             </p>

             <p>
                <!-- Los tipos de entrada "submit" y "reset" insertan 
                botones para enviar y borrar el contenido del 
                formulario, respectivamente -->
                <input type = "submit" value = "Enviar">
                <input type = "reset" value = "Borrar">
             </p>
        </form>

        <a href= "/Capitulo2/Ejercicios/Ejercicio2.9/Ejercicio2.9.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
