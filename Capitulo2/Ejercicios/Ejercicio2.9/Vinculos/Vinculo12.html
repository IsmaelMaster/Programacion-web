<!DOCTYPE html>

<!-- Fig. 2.14: formulario.html -->
<!-- Formulario con un campo de texto y campos ocultos. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Formularios
        </title>
    </head>

    <body>
        <h1>
            Formulario de retroalimentacion.
        </h1>

        <p>
            Llene este formulario para ayudarnos a mejorar nuestro sitio web. 
            Sus comentarios son muy importantes para nosotros.
        </p>

        <!-- Esta etiqueta empieza el formulario, indica el 
        método de enviar la informacion y la ubicacion de la 
        secuencia de comandos de procesamiento del formulario. -->
        <form method = "post" action = "https://www.deitel.com">
            <!-- Las entradas ocultas contienen informacion
            no visible que tambien se enviara-->
            <input type = "hidden" name = "destinatario" value = "deitel@deitel.com">
            <input type = "hidden" name = "asunto" value = "Formulario de retroalimentacion">
            <input type = "hidden" name = "redirigir" value = "Ejemplo1.html">

            <!-- <input type = "text"> Insertar un campo de texto -->
             <p>
                <label>
                    Nombre:
                    <input name = "nombre" type = "text" size = "25" maxlength = "30">
                </label>
             </p>

             <p>
                <!-- Los tipos de entrada "submit" y "reset" insertan 
                botones para enviar y borrar el contenido del 
                formulario, respectivamente -->
                <input type = "submit" value = "Enviar">
                <input type = "reset" value = "Borrar">
             </p>
        </form>

        <a href= "/Capitulo2/Ejercicios/Ejercicio2.9/Ejercicio2.9.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
