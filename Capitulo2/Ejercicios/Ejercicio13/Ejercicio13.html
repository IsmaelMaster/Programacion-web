        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->

        </title>
    </head>

    <body>
        <!-- Este es el texto de la página -->
        <h1>
            Pagina de ejemplo de tabla
        </h1>

        <table border = "1">
            <caption>
                <strong>
                    Esta es una tabla de muestra pequeña
                </strong>
            </caption>

            <thead>
                <tr>
                    <!-- Combina dos columnas. -->
                    <th colspan = "2">
                        <strong>
                            Encabezado de la tabla
                        </strong>
                    </th>
                </tr>
            </thead>

            <!-- Este es el cuerpo de mi tabla. -->
            <tbody>
                <tr>
                    <td colspan = "2">
                        Este es el cuerpo
                    </td>
                </tr>
            </tbody>

            <!-- La seleccion <tfoot> aparece al ultimo en la tabla
            da formato al pie de la tabla. -->
            <tfoot>
                <tr>
                    <th>
                        Este es el pie de la 
                    </th>

                    <th>
                        tabla
                    </th>
                </tr>
            </tfoot>
        </table>
        
        <a href= "/Capitulo2/Ejercicios/Ejercicios.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
