<!DOCTYPE html>

<!-- Fig. 2.12: tabla1.html -->
<!-- Creacion de una tabla basica. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Una tabla de HTML5 simple.
        </title>
    </head>

    <body>
        <!-- La etiqueta <table> abre una tabla -->
        <table border = "1">

            <!-- La etiqueta <caption> sintetiza el contenido de 
            la tabla (esto ayuda a las personas con discapacidad visual)-->
        
            <caption>
                <strong>
                    Tabla de frutas (1er columna) y sus precios (2da columna)
                </strong>
            </caption>
            
            <!-- La seleccion <thead> aparece primero en la tabla
            da formato al area del encabezado de la tabla. -->
            <thead>
                <tr>
                    <th>
                        Fruta
                    </th>

                    <th>
                        Precio
                    </th>
                </tr>
            </thead>

            <!-- La seleccion <tfoot> aparece al ultimo en la tabla
            da formato al pie de la tabla. -->
            <tfoot>
                <tr>
                    <th>
                        Total
                    </th>

                    <th>
                        $3.75
                    </th>
                </tr>
            </tfoot>

            <!-- Todo el contenido de la tabla esta encerrado 
            dentro del elemento <tbody> -->
            <tbody>
                <tr>
                    <td>
                        Manzana
                    </td>

                    <td>
                        $0.25
                    </td>
                </tr>

                <tr>
                    <td>
                        Naranja
                    </td>

                    <td>
                        $0.50
                    </td>
                </tr>

                <tr>
                    <td>
                        Platano
                    </td>

                    <td>
                        $1.75
                    </td>
                </tr>

                <tr>
                    <td>
                        Piña
                    </td>

                    <td>
                        $2.00
                    </td>
                </tr>
            </tbody>
        </table>

        <a href= "/Capitulo2/Ejemplos/Ejemplos.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
