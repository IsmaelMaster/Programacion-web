<!DOCTYPE html>

<!-- Fig. 2.13: tabla2.html -->
<!-- Tabla de HTML5 compleja. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Tablas
        </title>
    </head>

    <body>
        <h1>
            Ejemplo de tabla: combinando la filas y columnas
        </h1>

        <table border = "1">
            <caption>
                Una tabla de muestra mas compleja.
            </caption>

            <thead>
                <!-- Los elementos rowspan y colspan combinan el numero
                especificado de celdas en sentido vertical u horizontal. -->
                <tr>
                    <!-- Combina dos filas.-->
                    <th rowspan = "2">
                        <img src = "/Imagenes/camello.png" width = "205" 
                        height = "167" alt = "Silueta de un camello">
                    </th>

                    <!-- Combina cuatro columnas. -->
                    <th colspan = "4">
                        <strong>
                            Comparacion de camelidos.
                        </strong>
                        <br> Fecha aproximada: 04/septiembre/2026
                    </th>
                </tr>
                <tr>
                    <th>
                        # de jorobas
                    </th>

                    <th>
                        Region indigena
                    </th>

                    <th>
                        Escupe?
                    </th>

                    <th>
                        Produce lana?
                    </th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <th>
                        Camellos (bactrianos)
                    </th>

                    <td>
                        2
                    </td>

                    <td>
                        Africa/Asia
                    </td>

                    <td>
                        Si
                    </td>

                    <td>
                        Si
                    </td>
                </tr>
                <tr>
                    <th>
                        Llamas
                    </th>

                    <td>
                        1
                    </td>

                    <td>
                        Montaña de los Andes
                    </td>

                    <td>
                        Si
                    </td>

                    <td>
                        Si
                    </td>
                </tr>
            </tbody>
        </table>

        <a href= "/Capitulo2/Ejemplos/Ejemplos.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
