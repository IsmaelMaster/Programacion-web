<!DOCTYPE html>

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Ejercicio 6
        </title>
    </head>

    <body>
        <!-- Este es el texto de la página -->
        <h1>
            Ejercicio
        </h1>

        <h1>
            Autocompletar con datalist
        </h1>

        <form action = "#" method = "get">
            <p>
                <label for = "dia">
                    Selecciona un dia de la semana:
                </label>

                <input type = "text" id = "dia" name = "dia" list = "dias" placeholder = "Escribe un dia...">
                <datalist id = "dias">
                    <option value = "Lunes">
                    <option value = "Martes">
                    <option value = "Miercoles">
                    <option value = "Jueves">
                    <option value = "Viernes">
                    <option value = "Sabado">
                    <option value = "Domingo">
                </datalist>
            </p>

            <p>
                <input type = "submit" value = "Enviar">
            </p>
        </form>
        
        <a href= "/Capitulo3/Ejercicios/Ejercicios.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
