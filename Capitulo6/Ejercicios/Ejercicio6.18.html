        <p>
            6.18 Escriba una secuencia de comandos que reciba tres enteros del usuario y muestre la suma, promedio, producto, menor y mayor de los numeros en un dialogo alert.
        </p>

        <h1>
            Ejercicios ya resueltos
        </h1>

        <p>
            6.18
            <li>
                <script>
                    var n1 = parseInt(window.prompt("Primer entero:"));
                    var n2 = parseInt(window.prompt("Segundo entero:"));
                    var n3 = parseInt(window.prompt("Tercer entero:"));

                    var suma = n1 + n2 + n3;
                    var promedio = suma / 3;
                    var producto = n1 * n2 * n3;
                    var menor = Math.min(n1, n2, n3);
                    var mayor = Math.max(n1, n2, n3);

                    window.alert("Suma: " + suma + 
                                "\nPromedio: " + promedio + 
                                "\nProducto: " + producto + 
                                "\nMenor: " + menor + 
                                "\nMayor: " + mayor);
                </script>
            </li>
        </p>
