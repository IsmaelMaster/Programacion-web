         8.7 Escriba una secuencia de comandos que calcule el producto de los enteros impares del 1 al 15 y después imprima texto de HTML5 que muestre los resultados.
      </p>

      <h1>
         Ejercicios ya resueltos
      </h1>

      <p>
         8.7
         <p>
            <script>
               let producto = 1;
               for (let i = 1; i <= 15; i += 2)
                  producto *= i;

               document.writeln(`<p>El producto de los enteros impares del 1 al 15 es: ${producto}</p>`);
            </script> 
         </p>
