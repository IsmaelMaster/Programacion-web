      <p>
         8.8 Modifique el programa de interés compuesto de la figura 8.6, repitiendo sus pasos para las tasas de interés del 5, 6, 7, 8, 9 y 10 por ciento. 
         Use una instrucción for para variar la rasa de interés. 
         Use una tabla separada para cada tasa.
      </p>

      <h1>
         Ejercicios ya resueltos
      </h1>

      <p>
         8.8
         <p>
            <script>
               const principal = 1000.0;

               for (let tasa = 5; tasa <= 10; tasa++) {
                  const r = tasa / 100;
                  document.writeln(`<h3>Tasa de interés: ${tasa}%</h3>`);
                  document.writeln("<table border='1'><tr><th>Año</th><th>Cantidad en depósito</th></tr>");

                  for (let anio = 1; anio <= 10; anio++) {
                     const cantidad = principal * Math.pow(1 + r, anio);
                     document.writeln(`<tr><td>${anio}</td><td>$${cantidad.toFixed(2)}</td></tr>`);
                  }

                  document.writeln("</table>");
               }
            </script> 
         </p>
      </p>
