<!DOCTYPE html>

<!-- Fig. 8.1: ContadorWhile.html -->
<!-- Repeticion controlada por contador. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Repeticion controlada por contador
        </title>

        <script>
            var contador = 1; // Iniciacion

            while ( contador <= 7){ // Condición de repetición
                document.writeln( "<p style = 'font-size: " + contador + "ex'>Tamaño de fuente de HTML5 " + contador + "ex</p>" );
                ++contador; // Incremento
            } // fin de while
        </script>
    </head>

    <body>
        <a href= "/Capitulo8/Ejemplos/Ejemplos.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
