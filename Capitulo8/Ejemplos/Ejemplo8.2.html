<!DOCTYPE html>

<!-- Fig. 8.2: ContadorFor.html -->
<!-- Repeticion controlada por contador con la instruccion for. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Repeticion controlada por contador
        </title>

        <script>
            // La inicializacion, condición de repetición e
            // incremento se incluyen en el encabezado de
            // la instrucción for.
            for ( var contador = 1; contador <= 7; ++contador )
                document.writeln("<p style = 'font-size: " + contador + " ex'>Tamaño de fuente de HTML5 " + contador + "ex</p>");
        </script>
    </head>

    <body>
        <a href= "/Capitulo8/Ejemplos/Ejemplos.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
