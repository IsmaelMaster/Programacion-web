<!DOCTYPE html>

<!-- Fig. 8.5: suma.html -->
<!-- Suma con la estructura derepeticion for. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Sumar los enteros pares del 2 al 100
        </title>

        <script>
            var suma = 0;

            for ( var numero = 2; numero <= 100; numero += 2)
                suma += numero;

            document.writeln ( "La suma de los enteros pares " + "del 2 al 100 es " + suma );
        </script>
        <br>
    </head>

    <body>
        <a href= "/Capitulo8/Ejemplos/Ejemplos.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
