<!DOCTYPE html>

<!-- Fig. 8.7: PruebaSwitch.html -->
<!-- Uso de la instruccion de seleccion multiple switch. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Alternar entre formatos de lista de HTML5
        </title>

        <script>
            var selección; // La selección del usuario
            var etiquetaInicial; // Etiqueta de elemento de lista inicial
            var etiquetaFinal; // Etiqueta de elemento de lista final
            var entradaValida = true; // True sí la entrada es válida; false si no
            var tipoLista; // Tipo de lista como cadena

            selección = window.prompt( "Seleccione un estilo de lista:\n" + "1 (numerada), 2 (con letras), 3 (números romanos)", "1" );

            switch (selección){
                case "1":
                    etiquetaInicial = "<ol>";
                    etiquetaFinal = "</ol>";
                    tipoLista = "<h1>Lista numerada</h1>";
                    break;
                case "2":
                    etiquetaInicial = "<ol style = 'list-style-type: upper-alpha'>";
                    etiquetaFinal = "</ol>";
                    tipoLista = "<h1>Lista con letras</h1> ";
                    break;
                case "3":
                    etiquetaInicial = "<ol style = 'list-style-type: upper-roman'>";
                    etiquetaFinal = "</ol>";
                    tipoLista = "<h1>Lista con numeros romanos</h1>";
                    break;
                default:
                    entradaValida = false;
                    break;
            } // Fin de switch

            if (entradaValida === true){

                document.writeln(tipoLista + etiquetaInicial);

                for ( var i = 1; i <= 3; ++i )
                    document.writeln("<li>Elemento de lista " + i + "</li>");

                document.writeln(etiquetaFinal);
            } // Fin de if
            else
                document.writeln("Seleccion invalida: " + selección);
        </script>
    </head>

    <body>
        <a href= "/Capitulo8/Ejemplos/Ejemplos.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
