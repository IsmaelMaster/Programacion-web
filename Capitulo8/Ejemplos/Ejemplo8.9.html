<!DOCTYPE html>

<!-- Fig. 8.9: PruebaDoWhile.html -->
<!-- Uso de la instruccion de repeticion do...while. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Uso de la instruccion de repeticion do...while
        </title>

        <script>
            var contador = 1;

            do {
                document.writeln("<h" + contador + ">Este es " + "un encabezado de nivel h" + contador + "</h" + contador + ">");
                ++contador;
            } while (contador <= 6);
        </script>
    </head>

    <body>
        <a href= "/Capitulo8/Ejemplos/Ejemplos.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
