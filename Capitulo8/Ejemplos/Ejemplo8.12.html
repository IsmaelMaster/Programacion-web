<!DOCTYPE html>

<!-- Fig. 8.12: PruebaContinue.html -->
<!-- Uso de la instruccion continue en una instruccion for. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Uso de la instruccion de repeticion do...while
        </title>

        <script>
            for (var cuenta = 1; cuenta <= 10; ++cuenta ){
                if (cuenta == 5)
                continue; // Omite el resto del codigo del ciclo solo si cuenta == 5

                document.writeln (cuenta + " " );
            } // Fin de for

            document.writeln("<p>Se uso continue para no imprimir el 5</p>" );

        </script>
    </head>

    <body>
        <a href= "/Capitulo8/Ejemplos/Ejemplos.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
