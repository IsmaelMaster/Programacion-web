    <body>
        <!-- Este es el texto de la página -->
        <h1>

        </h1>

        <p>
            7.17 Utilbando una metodología similar a la del ejercicio 7.15, encuentre los dos valores más grandes de los 10 que se introdujeron. 
            [Nota: Puede introducir cada número sólo una vez].

        </p>

        <h1>
            Ejercicios ya resueltos
        </h1>

        <p>
            7.17 
            <script>
                let contador = 1;
                let mayor = null, segundo = null;

                while (contador <= 10) {
                    const numero = parseInt(prompt(`Número ${contador} de 10:`));

                    if (mayor === null || numero > mayor) {
                        segundo = mayor;
                        mayor = numero;
                    } else if (segundo === null || numero > segundo) {
                        segundo = numero;
                    }
                    contador++;
                }

                document.writeln(`<p>Mayor: ${mayor}</p>`);
                document.writeln(`<p>Segundo mayor: ${segundo}</p>`);
            </script>
        </p>
        
        <a href= "/Capitulo7/Ejercicios/Ejercicios.html">
