        <p>
            7.2 Escriba cuatro instrucciones de JavaScript que sumen 1, cada una, a la variable x, que contiene un numero.
        </p>

        <h1>
            Ejercicios de autoevaluacion ya resueltos
        </h1>

        <p>
            7.2 
            <ol>
                <li>
                    <strong>
                        x = x + 1;
                    </strong>
                </li>

                <li>
                    <strong>
                        x += 1;
                    </strong>
                </li>

                <li>
                    <strong>
                        ++x;
                    </strong>
                </li>

                <li>
                    <strong>
                        x++;
                    </strong>
                </li>
            </ol>
        </p>
