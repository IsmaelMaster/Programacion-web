<!DOCTYPE html>

<!-- Fig. 7.14: incremento.html -->
<!-- Preincremento y postincremento. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Preincremento y postincremento
        </title>

        <script>
            var c;

            c = 5;
            document.writeln("<h3>Postincremento</h3>");
            document.writeln("<p>" + c); // Imprime 5
            // Imprime 5 y luego incrementa
            document.writeln("" + c++);
            document.writeln("" + c + "</p>"); // Imprime 6

            c = 5;
            document.writeln("<h3>Preincremento</h3>");
            document.writeln("<p>" + c); // Imprime 5
            // Incrementa y luego imprime 6
            document.writeln("" + ++c);
            document.writeln("" + c + "</p>"); // Imprime 6
        </script>
    </head>

    <body>
        <a href= "/Capitulo7/Ejemplos/Ejemplos.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
