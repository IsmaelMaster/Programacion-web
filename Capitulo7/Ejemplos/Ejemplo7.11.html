<!DOCTYPE html>

<!-- Fig. 7.11: analisis.html -->
<!-- Calculo de los resultados de un examen. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Analisis de los resultados de un examen
        </title>

        <script>
            // Inicializar variables en declaraciones
            var aprobados = 0; // Numero de aprobados
            var reprobados = 0; // Numero de reprobados
            var estudiante = 1; // Contador de estudiantes
            var resultado; // El resultado de un examen

            // Procesar 10 estudiantes: Ciclo controlado por contador
            while (estudiante <= 10){
                resultado = window.prompt("Escriba el resultado (1 = aprobado, 2 = reprobado)", "0");

                if (resultado === "1"){
                    aprobados = aprobados + 1;
                }
                else {
                    reprobados = reprobados + 1;
                }
                estudiante = estudiante + 1;
            } // Fin de while

            // Fase de terminacion
            document.writeln("<h1>Resultados del examen</h1>");
            document.writeln("<p>Aprobados: " + aprobados + "; Reprobados: " + reprobados + "</p>");
            
            if (aprobados > 8){
                document.write("<p>Bono para el instructor>/p>");
            }
        </script>
    </head>

    <body>
        <a href= "/Capitulo7/Ejemplos/Ejemplos.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
