<!DOCTYPE html>

<!-- Fig. 4.1: enlinea.html -->
<!-- Uso de estilos en linea. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Estilos en linea 
        </title>
    </head>

    <body>
        <p>
            Este texto no tiene aplicado ningun estilo
        </p>

        <!-- El atributo style nos permite declarar estilos en linea.
        Debemos separar varias propiedades de style con un punto y coma. -->
        <p style = "font-size: 20pt;"> 
            Este texto tiene aplicado el estilo
            <em>
                font-size
            </em>
            , para que sea de 20pt.
        </p>

        <p style = "font-size: 20pt; color: deepskyblue;"> 
            Este texto tiene aplicado el estilo
            <em>
                font-size
            </em>
            y
            <em>
                color
            </em>
            , para que sea de 20pt y de color azul cielo profundo.
        </p>
        
        <a href= "/Capitulo4/Ejemplos/Ejemplos.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
