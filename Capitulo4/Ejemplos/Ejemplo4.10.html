<!DOCTYPE html>

<!-- Fig. 4.10: posicionamiento2.html -->
<!-- Posicionamiento relativo de los elementos. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Posicionamiento relativo
        </title>

        <style type = "text/css">
            p   {font-size: 1.3em; font-family: verdana, arial, sans-serif;}
            span    {color: red; font-size: .6em; height: 1em;}
            .super  {position: relative; top: -1ex;}
            .sub    {position: relative; bottom: -1ex;}
            .desplizq   {position: relative; left: -1ex;}
            .desplder   {position: relative; right: -1ex;}
        </style>
    </head>

    <body>
        <p>
            El texto al final de esta oracion
            <span class = "super">
                esta en superindice
            </span>
        </p>

        <p>
            El texto al final de esta oracion
            <span class = "sub">
                esta en subindice
            </span>
        </p>

        <p>
            El texto al final de esta oracion
            <span class = "desplizq">
                esta desplazado a la izquierda
            </span>
        </p>

        <p>
            El texto al final de esta oracion
            <span class = "desplder">
                esta desplazado a la derecha
            </span>
        </p>
        
        <a href= "/Capitulo4/Ejemplos/Ejemplos.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
