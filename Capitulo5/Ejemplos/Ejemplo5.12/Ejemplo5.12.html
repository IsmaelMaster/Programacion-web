<!DOCTYPE html>

<!-- Fig. 5.12: transiciones.html -->
<!-- Transiciones en CSS3. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Transiciones
        </title>

        <style type = "text/css">
            img {
                margin: 80px;
                -webkit-transition: -webkit-transform 4s;
                -moz-transition: -moz-transform 4s;
                -o-transition: -o-transform 4s;
                transition: transform 4s;
            }
            img:hover   {
                -webkit-transform: rotate(360deg) scale(2, 2);
                -moz-transform: rotate(360deg) scale(2, 2);
                -o-transform: rotate(360deg) scale(2, 2);
                transform: rotate(360deg) scale(2, 2);
            }
        </style>
    </head>

    <body>
        <img src = "/Imagenes/libro c++.jpg" width = "76" height = "100" alt = "Portada del libro C++ How to Program">

        <a href= "/Capitulo5/Ejemplos/Ejemplos.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso" >
        </a>
    </body>
</html>
