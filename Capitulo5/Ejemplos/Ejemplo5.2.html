<!DOCTYPE html>

<!-- Fig. 5.2: esquinasredondeadas.html -->
<!-- Uso de border-radius para agregar esquinas redondeadas a dos elementos. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Esquinas redondeadas
        </title>

        <style type = "text/css">
            div {
                border: 3px solid navy; 
                padding: 5px 20px;
                background: lightcyan;
                width: 200px;
                text-align: center;
                border-radius: 15px; /* Agrega esquinas redondeadas */
                margin-bottom: 20px;
            }
            #redonda2   {
                border: 3px solid navy;
                padding: 5px 20px;
                background: lightcyan;
                width: 200px;
                text-align: center;
                border-radius: 50px; /* Aumenta border-radius */
            }
        </style>
    </head>

    <body>
        <div>
            La propiedad border-radius agrega esquinas redondeadas a un elemento.
        </div>

        <div id = "redonda2">
            Al aumentar el valor de border-radius se redondean aun mas las esquinas del elemento.
        </div>
        
        <a href= "/Capitulo5/Ejemplos/Ejemplos.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
