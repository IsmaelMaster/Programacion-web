<!DOCTYPE html>

<!-- Fig. 5.10: bordeimagen.html -->
<!-- Estirar y repartir una imagen para crear un borde. -->

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Borde de imagen
        </title>

        <style type = "text/css">
            div {
                border-width: 30px;
                border-style: solid;
                border-color: transparent;
                width: 234px;
                padding: 20px;
                margin-bottom: 20px;
            }
            #stretch    {
                border-image: url(/Imagenes/flores.jpg) 80 stretch;
            }
            #repeat {
                border-image: url(/Imagenes/flores.jpg) 34% repeat;
            }
        </style>
    </head>

    <body>
        <h2>
            Bordes de imagen
        </h2>

        <img src = "/Imagenes/flores.jpg" alt = "imagen utilizada para demostrar los bordes">
        
        <p>
            <div id = "stretch">
                Se estira el borde de la imagen
            </div>
        </p>

        <p>
            <div id = "repeat">
                Se repite el borde de la imagen
            </div>
        </p>

        <a href= "/Capitulo5/Ejemplos/Ejemplos.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso" >
        </a>
    </body>
</html>
