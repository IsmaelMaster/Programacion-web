<!DOCTYPE html>

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Ejercicio 8
        </title>

        <style type = "text/css">
            .skew .textbox  {
                margin-left: 75px;
                background: lightgreen;
                height: 100px;
                width: 200px;
                padding: 25px 0;
                text-align: center;
                font-size: 250%;
                border: 3px solid darkgreen;
                border-radius: 15px;
                -webkit-animation: skew 3s infinite linear alternate;
                -moz-animation: skew 3s infinite linear alternate;
                animation: skew 3s infinite linear alternate;
            }
            @-webkit-keyframes skew {
                0%   { -webkit-transform: skewY(30deg); }
                50%  { -webkit-transform: skewX(30deg); }
                100% { -webkit-transform: skewY(30deg); }
            }
            @-moz-keyframes skew {
                0%   { -moz-transform: skewY(30deg); }
                50%  { -moz-transform: skewX(30deg); }
                100% { -moz-transform: skewY(30deg); }
            }
            @-keyframes skew {
                0%   { transform: skewY(30deg); }
                50%  { transform: skewX(30deg); }
                100% { transform: skewY(30deg); }
            }
        </style>
    </head>

    <body>
        <div class = "box skew">
            <div class = "textbox">
                Inclinar texto
            </div>
        </div>

        <a href= "/Capitulo5/Ejercicios/Ejercicios.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso" >
        </a>
    </body>
</html>
