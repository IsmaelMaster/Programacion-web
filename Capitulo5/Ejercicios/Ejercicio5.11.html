<!DOCTYPE html>

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Ejercicio 9
        </title>

        <style type = "text/css">
            body {
                margin: 0;
                padding: 0;
            }
            #portada    {
                position: relative;
                margin: 0 auto;
                width: 300px;
                height: 400px;
            }
            #portada img    {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                -webkit-transition: opacity 3s linear;
                transition: opacity 3s linear;
            }
            #portada:hover .capa2   {opacity: 0; transition-delay: 16s;}
            #portada:hover .capa3   {opacity: 0; transition-delay: 12s;}
            #portada:hover .capa4   {opacity: 0; transition-delay: 8s;}
            #portada:hover .capa5   {opacity: 0; transition-delay: 4s;}
            .regreso    {
                display: inline-block;
                margin: 20px;
                position: relative;
                z-index: 10;
            }
            .regreso img    {
                display: block;
                width: 90px;
                height: 120px;
            }
        </style>
    </head>

    <body>
        <div id = "portada">
            <img class = "capa1" src = "/Imagenes/escandalosos.png" alt = "Imagen 1">
            <img class = "capa2" src = "/Imagenes/gravity falls.jpg" alt = "Imagen 2">
            <img class = "capa3" src = "/Imagenes/mario.jpg" alt = "Imagen 3">
            <img class = "capa4" src = "/Imagenes/toad.jpg" alt = "Imagen 4">
            <img class = "capa5" src = "/Imagenes/yoshi.jpg" alt = "Imagen 5">
        </div>

        <a class = "regreso" href= "/Capitulo5/Ejercicios/Ejercicios.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso" >
        </a>
    </body>
</html>
