<!DOCTYPE html>

<html>
    <head>
        <meta charset = "utf-8">
        <!-- Este es el nombre de mi pantalla -->
        <title>
            Ejercicio 1
        </title>

        <style type = "text/css">
            h1  {
                text-shadow: 2px 5px 6px deepskyblue; /* Agregar sombra */
                font-size: 400%; /* Aumenta el tamaño de la fuente */
                position: relative;
                -webkit-animation: movingh1 linear 10s 1s 1 alternate;
                -moz-animation: movingh1 linear 10s 1s 1 alternate;
                animation: movingh1 linear 10s 1s 1 alternate;
            }
            @-webkit-keyframes movingh1  {
                0%  {opacity: 1; left: 0px; top: 0px;}
                50% {opacity: 1; left: 1px; top: 3px;}
                100% {opacity: 1; left: 2px; top: 5px;}
            }
            @-moz-keyframes movingh1  {
                0%  {opacity: 1; left: 0px; top: 0px;}
                50% {opacity: 1; left: 1px; top: 3px;}
                100% {opacity: 1; left: 2px; top: 5px;}
            }
            @keyframes movingh1  {
                0%  {opacity: 1; left: 0px; top: 0px;}
                50% {opacity: 1; left: 1px; top: 3px;}
                100% {opacity: 1; left: 2px; top: 5px;}
            }
        </style>
    </head>

    <body>
        <h1>
            Nuevas funciones en CSS3
        </h1>
        
        <a href= "/Capitulo5/Ejercicios/Ejercicios.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body>
</html>
