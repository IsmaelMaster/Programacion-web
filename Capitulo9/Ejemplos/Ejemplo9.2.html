<!DOCTYPE html>

<!--fig. 9.2: CuadradoEnt.html-->
<!--funcion cuadrado definido por el programador-->
<html>
    <head>
        <meta charset="utf-8">

        <title>
            Una funcion cuadrado definida por el programador
        </title>

        <style type="text/css">
            p { margin: 0;}
        </style>

        <script>

            document.writeln("<h1>Obtener el cuadrado de los numeros del 1 al 10 </h1>")

            //obtener el cuadrado de los numeros del 1 al  10
            for ( var x = 1; x <= 10; ++x)
                document.writeln ("<p>El cuadrado de " + x + " es " + cuadrado (x) + "</p>");

            // El cuerpo de la siguiente definicion de la funcion cuadrado se ejecuta
            // Solo cuando la funcion se llama de manera explicita como en la linea 19
            function cuadrado ( y ){
                return y * y;
            } //fin de la funcion cuadrado

        </script>
    </head>

        <a href= "/Capitulo9/Ejemplos/Ejemplos.html">
            <img src = "/Imagenes/regreso.png" width = "90" height = "120" alt = "Regreso">
        </a>
    </body> <!--El elemento body est&acute; vac&iacute;0-->
</html>
